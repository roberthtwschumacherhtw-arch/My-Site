<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kaffeemaschinen-Berater | JDE Professional</title>
  <style>
    :root {
      /* JDE Corporate Colors */
      --jde-brown: #331E00;
      --jde-cream: #F6EADC;
      --jde-offwhite: #FFFDFA;
      
      /* Semantic Variables */
      --bg-gradient: radial-gradient(circle at top left, #F6EADC 0, #FFFDFA 40%, #ffffff 100%);
      --card-bg: var(--jde-offwhite);
      --text-main: var(--jde-brown);
      --text-muted: rgba(51, 30, 0, 0.7);
      --border-color: rgba(51, 30, 0, 0.15);
      --primary: var(--jde-brown);
      --primary-hover: #4a2c00;
      --accent-selection: var(--jde-cream);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px;
      line-height: 1.6;
    }

    .container { max-width: 900px; margin: 0 auto; }
    .center { text-align: center; }

    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 18px 40px rgba(51, 30, 0, 0.08);
      border: 1px solid var(--border-color);
    }

    header { margin-bottom: 24px; }

    h1 { font-size: clamp(24px, 4vw, 32px); margin: 8px 0; font-weight: 700; color: var(--jde-brown); }
    h2 { font-size: 20px; margin: 8px 0; font-weight: 600; }
    
    .muted { color: var(--text-muted); font-size: 0.95rem; }
    .grid { display: grid; gap: 16px; }
    .grid.cols-3 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }

    /* Interactive Buttons */
    button, .machine-card {
      cursor: pointer;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      text-align: left;
      background: #fff;
      color: var(--text-main);
      box-shadow: 0 4px 12px rgba(51, 30, 0, 0.03);
      transition: all 0.2s ease;
      font-size: 1rem;
      position: relative;
      text-decoration: none; /* Für Links */
      display: block; /* Für Links */
    }

    button:hover:not(:disabled), .machine-card:hover {
      transform: translateY(-3px);
      border-color: var(--jde-brown);
      box-shadow: 0 8px 20px rgba(51, 30, 0, 0.1);
    }

    /* Machine Card Specifics */
    .machine-card {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100%;
    }
    
    .machine-link-icon {
      margin-top: auto;
      background: var(--jde-brown);
      color: white;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 99px;
      margin-top: 12px;
    }

    /* Icons */
    .icon-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      background: var(--jde-brown);
      color: var(--jde-offwhite);
      font-size: 24px;
      box-shadow: 0 4px 10px rgba(51, 30, 0, 0.2);
    }

    .small { font-size: 13px; }

    /* Badge / Pill */
    .pill {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--jde-brown);
      color: var(--jde-offwhite);
      font-weight: 600;
      font-size: 0.8rem;
      margin-top: 8px;
      margin-bottom: 8px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }

    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 24px; }

    .btn-primary {
      background: var(--primary);
      color: var(--jde-offwhite);
      padding: 14px 24px;
      border-radius: 999px;
      border: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }

    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-2px); }

    .btn-ghost {
      background: transparent;
      color: var(--text-main);
      padding: 14px 24px;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      font-weight: 500;
    }

    .btn-ghost:hover {
      border-color: var(--jde-brown);
      background: rgba(246, 234, 220, 0.3);
    }

    .btn-disabled {
      background: #e5e7eb;
      color: #9ca3af;
      cursor: not-allowed;
      border-color: transparent;
      box-shadow: none;
    }
    
    .benefit { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
    .check {
      width: 24px; height: 24px; flex-shrink: 0; border-radius: 50%;
      background: #3ABF4A; color: white; display: inline-grid; place-items: center;
      font-weight: 700; font-size: 14px;
    }

    /* Formular */
    form .field { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.9rem; }
    input, textarea {
      width: 100%; padding: 12px 16px; border: 1px solid var(--border-color);
      border-radius: 12px; background: #fff; font-family: inherit;
      color: var(--text-main); outline: none; transition: border-color 0.2s;
    }
    input:focus, textarea:focus {
      border-color: var(--jde-brown); box-shadow: 0 0 0 3px rgba(51, 30, 0, 0.08);
    }

    footer { margin-top: 32px; text-align: center; color: var(--text-muted); font-size: 13px; }
    
    .logo-container {
        width: 60px; height: 60px; margin: 0 auto 10px; border-radius: 50%;
        overflow: hidden; box-shadow: 0 4px 12px rgba(51,30,0,0.15);
        background: white; display:flex; align-items:center; justify-content:center;
    }
    .logo-container img { width: 100%; height: 100%; object-fit: contain; }

    @media (max-width: 640px) {
      .card { padding: 20px; border-radius: 20px; }
      h1 { font-size: 26px; }
      .icon-circle { width: 56px; height: 56px; }
      .actions { flex-direction: column; }
      .actions button { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="app" class="card"></div>
    <footer>© 2025 Jacobs Professional – Kaffeemaschinen-Berater Demo</footer>
  </div>

  <script>
  // --- Data & Helpers ---
  const app = document.getElementById('app');

  const branchen = [
    { id: 'buero', name: 'Büro', color: '#331E00', icon: '🏢' },
    { id: 'gastronomie', name: 'Gastronomie', color: '#C89A4B', icon: '🍽️' },
    { id: 'hotel', name: 'Hotel', color: '#5A3A15', icon: '🏨' },
    { id: 'produktion', name: 'Produktion', color: '#6b7280', icon: '🏭' },
    { id: 'bildung', name: 'Bildung', color: '#331E00', icon: '🎓' },
    { id: 'health', name: 'Health & Care', color: '#C89A4B', icon: '❤️' }
  ];

  const mitarbeiterGroessen = [
    { id: 'bis10', label: 'Bis 10 Mitarbeiter', value: 'bis10' },
    { id: '11-50', label: '11–50 Mitarbeiter', value: '11-50' },
    { id: '51-200', label: '51–200 Mitarbeiter', value: '51-200' },
    { id: 'ueber200', label: 'Über 200 Mitarbeiter', value: 'ueber200' }
  ];

  const getraenkeOptionen = [
    { id: 'kaffee', label: 'Kaffee (Schwarz)', icon: '☕' },
    { id: 'cappuccino', label: 'Milchspezialitäten', icon: '🥛' },
    { id: 'tee', label: 'Heißwasser / Tee', icon: '🍵' },
    { id: 'kakao', label: 'Kakao', icon: '🍫' }
  ];

  let state = {
    level: 1,
    branche: '',
    einsatzart: '',
    kundentyp: '',
    mitarbeiter: '',
    getraenke: [],
    festwasser: '',
    showForm: false,
    form: { firma:'', ansprechpartner:'', email:'', telefon:'', nachricht:'' }
  };

  // --- Rendering ---
  function render(){
    app.innerHTML = '';
    window.scrollTo(0,0);
    
    if(state.level === -1){ return renderEventAbort(); }
    if(state.level === -2){ return renderPrivateAbort(); }
    if(state.level === 1){ return renderBranchenwahl(); }
    if(state.level === 2){ return renderEinsatzart(); }
    if(state.level === 3){ return renderKundentyp(); }
    if(state.level === 4){ return renderMitarbeiter(); }
    if(state.level === 5){ return renderGetraenke(); }
    if(state.level === 6 && !state.showForm){ return renderEmpfehlung(); }
    if(state.showForm){ return renderForm(); }
    
    app.innerHTML = '<p class="center muted">Fehler - bitte neu laden.</p>';
  }

  function renderBranchenwahl(){
    const container = document.createElement('div');
    container.innerHTML = `
      <header class="center">
        <div class="logo-container" style="background:#331E00; color:#fff; font-weight:bold; font-size:12px;">JDE</div>
        <h1>Kaffeemaschinen-Berater</h1>
        <p class="muted">Finden Sie die perfekte Kaffeelösung für Ihr Unternehmen.</p>
        <div class="pill">Schritt 1 von 6</div>
      </header>
      <section>
        <h2 class="center">In welcher Branche sind Sie tätig?</h2>
        <div class="grid cols-3" id="branchen-grid" style="margin-top:24px;"></div>
      </section>
      <div class="actions center" style="justify-content:center">
         <a href="#" onclick="location.reload()" class="btn-ghost" style="text-decoration:none; text-align:center;">Abbrechen</a>
      </div>
    `;
    app.appendChild(container);
    const grid = container.querySelector('#branchen-grid');
    branchen.forEach(b => {
      const btn = document.createElement('button');
      btn.innerHTML = `
        <div class="icon-circle" style="background:${b.color};">
          <div style="font-size:24px">${b.icon}</div>
        </div>
        <strong style="display:block;text-align:center">${b.name}</strong>
      `;
      btn.addEventListener('click', () => { state.branche = b.id; state.level = 2; render(); });
      grid.appendChild(btn);
    });
  }

  function renderEinsatzart(){
    const container = document.createElement('div');
    container.innerHTML = `
      <header class="center small">
        <div class="pill">Schritt 2 von 6</div>
        <h2>Wie möchten Sie die Maschine nutzen?</h2>
      </header>
      <div class="grid" style="margin-top:24px">
        <button id="dauerhaft">
          <div style="font-size:24px;margin-bottom:8px">🏢</div>
          <strong>Dauerhafter Einsatz</strong>
          <div class="muted small">Tägliche Versorgung im Betrieb</div>
        </button>
        <button id="event">
          <div style="font-size:24px;margin-bottom:8px">🎉</div>
          <strong>Einmaliges Event</strong>
          <div class="muted small">Kurzzeitmiete für Veranstaltungen</div>
        </button>
      </div>
      <div class="actions"><button class="btn-ghost" id="back">← Zurück</button></div>
    `;
    app.appendChild(container);
    container.querySelector('#dauerhaft').addEventListener('click', () => { state.einsatzart = 'dauerhaft'; state.level = 3; render(); });
    container.querySelector('#event').addEventListener('click', () => { state.einsatzart = 'event'; state.level = -1; render(); });
    container.querySelector('#back').addEventListener('click', () => { state.level = 1; render(); });
  }

  function renderKundentyp(){
    const container = document.createElement('div');
    container.innerHTML = `
      <header class="center small">
        <div class="pill">Schritt 3 von 6</div>
        <h2>Für wen ist die Maschine?</h2>
      </header>
      <div class="grid" style="margin-top:24px">
        <button id="gewerblich">
           <div style="font-size:24px;margin-bottom:8px">💼</div>
           <strong>Gewerbliche Nutzung</strong>
           <div class="muted small">Für Büros, Gastronomie, Health & Care</div>
        </button>
        <button id="privat">
           <div style="font-size:24px;margin-bottom:8px">🏠</div>
           <strong>Private Nutzung</strong>
           <div class="muted small">Für den Haushalt</div>
        </button>
      </div>
      <div class="actions"><button class="btn-ghost" id="back">← Zurück</button></div>
    `;
    app.appendChild(container);
    container.querySelector('#gewerblich').addEventListener('click', () => { state.kundentyp = 'gewerblich'; state.level = 4; render(); });
    container.querySelector('#privat').addEventListener('click', () => { state.kundentyp = 'privat'; state.level = -2; render(); });
    container.querySelector('#back').addEventListener('click', () => { state.level = 2; render(); });
  }

  function renderMitarbeiter(){
    const container = document.createElement('div');
    container.innerHTML = `
      <header class="center small">
        <div class="pill">Schritt 4 von 6</div>
        <h2>Wie viele Mitarbeiter / Gäste versorgen Sie täglich?</h2>
      </header>
      <div class="grid cols-3" id="mitarbeiter-grid" style="margin-top:24px"></div>
      <div class="actions"><button class="btn-ghost" id="back">← Zurück</button></div>
    `;
    app.appendChild(container);
    const grid = container.querySelector('#mitarbeiter-grid');
    mitarbeiterGroessen.forEach(g => {
      const btn = document.createElement('button');
      btn.innerHTML = `
        <div style="font-size:24px;margin-bottom:8px; color:var(--jde-brown);">👥</div>
        <strong style="display:block;text-align:center">${g.label}</strong>
      `;
      btn.addEventListener('click', () => { state.mitarbeiter = g.value; state.level = 5; render(); });
      grid.appendChild(btn);
    });
    container.querySelector('#back').addEventListener('click', () => { state.level = 3; render(); });
  }

  function renderGetraenke(){
    const container = document.createElement('div');
    container.innerHTML = `
      <header class="center small">
        <div class="pill">Schritt 5 von 6</div>
        <h2>Welche Getränkevielfalt wünschen Sie?</h2>
        <p class="muted">Mehrfachauswahl möglich</p>
      </header>
      <div class="grid cols-3" id="getraenke-grid" style="margin-top:24px"></div>
      <div style="margin-top:24px; text-align:center;">
        <button id="weiter" class="btn-primary btn-disabled">Weiter zum letzten Schritt</button>
      </div>
      <div class="actions"><button class="btn-ghost" id="back">← Zurück</button></div>
    `;
    app.appendChild(container);
    const grid = container.querySelector('#getraenke-grid');
    getraenkeOptionen.forEach(g => {
      const btn = document.createElement('button');
      btn.setAttribute('data-id', g.id);
      updateGetraenkButton(btn, g);
      btn.addEventListener('click', () => {
        toggleGetraenk(g.id);
        updateGetraenkButton(btn, g);
        updateWeiterButton();
      });
      grid.appendChild(btn);
    });
    
    function updateWeiterButton(){
      const weiter = container.querySelector('#weiter');
      if(state.getraenke.length > 0){ 
          weiter.classList.remove('btn-disabled'); 
          weiter.disabled=false; 
      } else { 
          weiter.classList.add('btn-disabled'); 
          weiter.disabled=true; 
      }
    }

    function updateGetraenkButton(btn,g){
      const selected = state.getraenke.includes(g.id);
      const bg = selected ? 'var(--jde-cream)' : '#fff';
      const border = selected ? '2px solid var(--jde-brown)' : '1px solid var(--border-color)';
      
      btn.style.background = bg;
      btn.style.border = border;
      
      btn.innerHTML = `
        <div style="font-size:26px;margin-bottom:8px">${g.icon}</div>
        <strong>${g.label}</strong>
        ${selected ? '<div style="margin-top:8px; color:var(--jde-brown); font-weight:bold;" class="small">Ausgewählt ✓</div>' : ''}
      `;
    }
    
    function toggleGetraenk(id){
      const idx = state.getraenke.indexOf(id);
      if(idx >= 0) state.getraenke.splice(idx,1);
      else state.getraenke.push(id);
    }
    
    container.querySelector('#weiter').addEventListener('click', () => {
      if(state.getraenke.length === 0) return;
      renderFestwasserQuestion();
    });
    container.querySelector('#back').addEventListener('click', () => { state.level = 4; render(); });
    updateWeiterButton();
  }

  function renderFestwasserQuestion(){
    app.innerHTML = '';
    const container = document.createElement('div');
    container.innerHTML = `
      <header class="center small">
        <div class="pill">Schritt 6 von 6</div>
        <h2>Ist ein Festwasseranschluss möglich?</h2>
        <p class="muted">Ein Anschluss sorgt für unterbrechungsfreien Betrieb ohne Tanknachfüllen.</p>
      </header>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px; margin-top:24px">
        <button id="fest-ja" style="text-align:center">
            <div style="font-size:24px;margin-bottom:8px">🚰</div>
            <strong>Ja</strong><br><span class="muted small">Festwasser möglich</span>
        </button>
        <button id="fest-nein" style="text-align:center">
            <div style="font-size:24px;margin-bottom:8px">🍶</div>
            <strong>Nein</strong><br><span class="muted small">Wassertank benötigt</span>
        </button>
      </div>
      <div class="actions"><button class="btn-ghost" id="back">← Zurück</button></div>
    `;
    app.appendChild(container);
    container.querySelector('#fest-ja').addEventListener('click', () => { state.festwasser = 'ja'; state.level = 6; render(); });
    container.querySelector('#fest-nein').addEventListener('click', () => { state.festwasser = 'nein'; state.level = 6; render(); });
    container.querySelector('#back').addEventListener('click', () => { state.level = 5; render(); });
  }

  // --- LOGIC: JDE Recommendations with Links ---
  function getMaschinenEmpfehlung(){
    const m = state.mitarbeiter;
    // JDE Professional / Partner Modelle für den deutschen Markt
    // URLs verweisen auf die Produktseiten bei jacobs-professional.de
    
    if(m === 'bis10'){
      return {
        category:'Office Compact & Design',
        benefits:[
          'Ideal für kleine Teams & Meetingräume',
          'Premium Design (z.B. L\'OR Promesso)',
          'Einfache Plug & Play Installation'
        ],
        modelle:[
          { 
            name: "L'OR Promesso", 
            icon: "💎", 
            url: "https://www.jacobs-professional.de/produkte/kaffeemaschinen/liquid-roast-maschinen/lor-promesso/"
          },
          { 
            name: "Jura WE8", 
            icon: "☕", 
            url: "https://www.jacobs-professional.de/produkte/kaffeemaschinen/kaffeevollautomaten/jura-we8/"
          },
          { 
            name: "L'OR Suprême", 
            icon: "🧼", 
            url: "https://www.jacobs-professional.de/produkte/kaffeemaschinen/kapselmaschinen/lor-professional-supreme/" 
          }
        ]
      };
    } else if(m === '11-50'){
      return {
        category:'Business Performance',
        benefits:[
          'Schnelle Zubereitung (Liquid Roast oder Bohnen)',
          'Hohe Getränkevielfalt (Kakao, Milch)',
          'Wartungsarm & Hygienisch'
        ],
        modelle:[
          { 
            name: "Cafitesse Excellence Compact", 
            icon: "🚀", 
            url: "https://www.jacobs-professional.de/produkte/kaffeemaschinen/liquid-roast-maschinen/cafitesse-excellence-compact-touch/" 
          },
          { 
            name: "WMF 1100 S", 
            icon: "⚙️", 
            url: "https://www.jacobs-professional.de/produkte/kaffeemaschinen/kaffeevollautomaten/wmf-1100s/" 
          },
          { 
            name: "Barista One", 
            icon: "👨‍🍳", 
            url: "https://www.jacobs-professional.de/produkte/kaffeemaschinen/kaffeevollautomaten/barista-one/" 
          }
        ]
      };
    } else if(m === '51-200'){
      return {
        category:'High Volume Professional',
        benefits:[
          'Maximale Geschwindigkeit bei Stoßzeiten',
          'Parallelausgabe & große Touchscreens',
          'Cafitesse System für höchste Effizienz'
        ],
        modelle:[
          { 
            name: "Cafitesse Excellence Touch", 
            icon: "⚡", 
            url: "https://www.jacobs-professional.de/produkte/kaffeemaschinen/liquid-roast-maschinen/cafitess-excellence-touch/" 
          },
          { 
            name: "Schaerer Coffee Soul", 
            icon: "🔧", 
            url: "https://www.jacobs-professional.de/produkte/kaffeemaschinen/kaffeevollautomaten/schaerer-coffee-soul/" 
          },
          { 
            name: "Cafitesse Quantum 110", 
            icon: "💧", 
            url: "https://www.jacobs-professional.de/produkte/kaffeemaschinen/easy-coffee-maschinen/cafitesse-quantum-110/" 
          }
        ]
      };
    } else {
      return {
        category:'Industrial & Kantine',
        benefits:[
          'Industriestandard für sehr hohe Mengen',
          'Hygienisch (HACCP) & extrem schnell',
          'Massive Stundenleistung'
        ],
        modelle:[
          { 
            name: "Cafitesse Quantum 300", 
            icon: "🏭", 
            url: "https://www.jacobs-professional.de/produkte/kaffeemaschinen/easy-coffee-maschinen/cafitesse-quantum-300/" 
          },
          { 
            name: "Franke A800", 
            icon: "🦾", 
            url: "https://www.jacobs-professional.de/produkte/kaffeemaschinen/kaffeevollautomaten/franke-a800/" 
          },
          { 
            name: "Bolero Turbo (Instant)", 
            icon: "⏱️", 
            url: "https://www.jacobs-professional.de/produkte/kaffeemaschinen/instant-kaffeeautomaten/bolero-turbo-403/" 
          }
        ]
      };
    }
  }

  function renderEmpfehlung(){
    const empfehlung = getMaschinenEmpfehlung();
    const container = document.createElement('div');
    container.innerHTML = `
      <header class="center">
        <div style="font-size:48px; margin-bottom:10px">🏆</div>
        <h1 style="color:var(--jde-brown)">Unsere Empfehlung</h1>
        <div class="pill" style="font-size:1rem; background:var(--jde-cream); color:var(--jde-brown)">${empfehlung.category}</div>
        <p class="muted">Klicken Sie auf ein Modell, um es direkt bei JDE Professional anzusehen.</p>
      </header>

      <div style="margin-top:24px; padding:20px; background:#fff; border-radius:16px; border:1px solid var(--border-color);">
        <h2 style="margin-top:0; text-align:center;">Passende Modelle</h2>
        
        <div id="models" class="grid cols-3" style="margin-top:16px"></div>

        <h2 style="margin-top:32px">Ihre Vorteile</h2>
        <div id="benefits" style="margin-top:12px"></div>
      </div>

      <div style="margin-top:24px" class="center">
        <h3>Individuelles Angebot?</h3>
        <p class="muted">Gerne erstellen wir Ihnen eine unverbindliche Kalkulation.</p>
        <div class="actions center" style="justify-content:center;margin-top:16px">
          <button id="open-form" class="btn-primary">Angebot anfordern</button>
          <button id="new" class="btn-ghost">Neu starten</button>
        </div>
      </div>
    `;
    app.appendChild(container);

    const modelsDiv = container.querySelector('#models');
    
    // Maschinen rendern mit Link-Funktion
    empfehlung.modelle.forEach(m => {
      const link = document.createElement('a');
      link.className = 'machine-card';
      link.href = m.url;
      link.target = "_blank"; // Öffnet in neuem Tab
      link.rel = "noopener noreferrer";
      
      link.innerHTML = `
        <div style="font-size:32px; margin-bottom:12px;">${m.icon}</div>
        <strong style="font-size:1.1rem; display:block; color:var(--jde-brown)">${m.name}</strong>
        <div class="machine-link-icon">Zum Produkt ↗</div>
      `;
      modelsDiv.appendChild(link);
    });

    const benefitsDiv = container.querySelector('#benefits');
    empfehlung.benefits.forEach(b => {
      const d = document.createElement('div');
      d.className = 'benefit';
      d.innerHTML = `<div class="check">✓</div><div>${b}</div>`;
      benefitsDiv.appendChild(d);
    });

    container.querySelector('#open-form').addEventListener('click', () => { state.showForm = true; render(); });
    container.querySelector('#new').addEventListener('click', () => { restart(); render(); });
  }

  function renderForm(){
    const container = document.createElement('div');
    container.innerHTML = `
      <header class="center small">
        <div class="pill">Kontakt</div>
        <h2>Angebot anfordern</h2>
        <p class="muted">Wir erstellen Ihnen ein individuelles Angebot basierend auf Ihren Angaben.</p>
      </header>
      <form id="lead-form" class="card" style="border:none; box-shadow:none; padding:0; background:transparent;" novalidate>
        <div class="field"><label>Firma *</label><input id="firma" type="text" placeholder="Firmenname" value="${escapeHtml(state.form.firma)}"></div>
        <div class="field"><label>Ansprechpartner *</label><input id="ansprechpartner" type="text" placeholder="Vorname Nachname" value="${escapeHtml(state.form.ansprechpartner)}"></div>
        <div class="field"><label>E-Mail *</label><input id="email" type="email" placeholder="name@firma.de" value="${escapeHtml(state.form.email)}"></div>
        <div class="field"><label>Telefon *</label><input id="telefon" type="tel" placeholder="+49 ..." value="${escapeHtml(state.form.telefon)}"></div>
        <div class="field"><label>Nachricht (Optional)</label><textarea id="nachricht" rows="4" placeholder="Zusätzliche Wünsche...">${escapeHtml(state.form.nachricht)}</textarea></div>
        <div style="display:flex; gap:12px; margin-top:24px; flex-wrap:wrap;">
          <button id="submit" class="btn-primary" type="button" style="flex:1">Anfrage absenden</button>
          <button id="back" class="btn-ghost" type="button">← Zurück</button>
        </div>
      </form>
    `;
    app.innerHTML = '';
    app.appendChild(container);

    container.querySelector('#submit').addEventListener('click', () => {
      const firma = container.querySelector('#firma').value.trim();
      const ansprechpartner = container.querySelector('#ansprechpartner').value.trim();
      const email = container.querySelector('#email').value.trim();
      const telefon = container.querySelector('#telefon').value.trim();

      if(!firma || !ansprechpartner || !email || !telefon){
        alert('Bitte füllen Sie alle Pflichtfelder (*) aus.');
        return;
      }
      alert('Vielen Dank! Ihre Anfrage wurde simuliert.');
      restart();
      render();
    });

    container.querySelector('#back').addEventListener('click', () => { state.showForm = false; render(); });
  }

  function renderEventAbort(){
    app.innerHTML = `
      <div class="center" style="padding:40px 0">
        <div style="font-size:48px;margin-bottom:16px">ℹ️</div>
        <h2>Event-Anfrage</h2>
        <p class="muted" style="max-width:500px; margin:0 auto 24px;">
          Unsere Online-Beratung ist auf dauerhafte Lösungen spezialisiert.
        </p>
        <div class="actions" style="justify-content:center;">
          <button class="btn-primary" id="restart">Zurück zum Start</button>
        </div>
      </div>
    `;
    document.getElementById('restart').addEventListener('click', () => { restart(); render(); });
  }

  function renderPrivateAbort(){
    app.innerHTML = `
      <div class="center" style="padding:40px 0">
        <div style="font-size:48px;margin-bottom:16px">🏠</div>
        <h2>Privatkunden</h2>
        <p class="muted" style="max-width:500px; margin:0 auto 24px;">
           Jacobs Douwe Egberts Professional richtet sich ausschließlich an Geschäftskunden (B2B).
        </p>
        <div class="actions" style="justify-content:center;">
          <button class="btn-primary" id="restart2">Zurück zum Start</button>
        </div>
      </div>
    `;
    document.getElementById('restart2').addEventListener('click', () => { restart(); render(); });
  }

  function restart(){
    state = {
      level: 1,
      branche: '',
      einsatzart: '',
      kundentyp: '',
      mitarbeiter: '',
      getraenke: [],
      festwasser: '',
      showForm: false,
      form: { firma:'', ansprechpartner:'', email:'', telefon:'', nachricht:'' }
    };
  }

  function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[m])); }

  // Initial render
  render();

  </script>
</body>
</html>
