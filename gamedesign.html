<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>JDE Professional | Kaffeemaschinen-Berater</title>
  <style>
    :root {
      /* JDE Colors */
      --jde-brown: #331E00;
      --jde-gold: #C89A4B;
      --jde-cream: #F6EADC;
      --jde-grey: #f9f9f9;
      
      --bg-gradient: radial-gradient(circle at top left, #F6EADC 0, #ffffff 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --shadow: 0 10px 40px rgba(51, 30, 0, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-gradient);
      color: var(--jde-brown);
      min-height: 100vh;
      padding: 20px;
      line-height: 1.5;
    }

    .container { max-width: 1100px; margin: 0 auto; }
    .center { text-align: center; }

    /* Main App Card */
    .app-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 40px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.8);
      min-height: 650px;
      display: flex;
      flex-direction: column;
    }

    h1, h2 { color: var(--jde-brown); margin-top: 0; }
    h2 { font-size: 22px; font-weight: 700; margin-bottom: 24px; }
    
    /* Interactive Grid */
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    
    .option-btn {
      background: #fff;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 16px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
    }
    .option-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      border-color: var(--jde-gold);
    }
    .option-btn.selected {
      background: var(--jde-cream);
      border-color: var(--jde-brown);
      box-shadow: inset 0 0 0 2px var(--jde-brown);
    }
    .option-icon { font-size: 32px; margin-bottom: 12px; display: block; }
    .option-label { font-weight: 700; display: block; margin-bottom: 4px; font-size: 0.95rem; }
    .option-sub { font-size: 0.8rem; color: #666; display: block; line-height: 1.3; }

    /* Navigation */
    .footer-nav { margin-top: auto; padding-top: 40px; display: flex; justify-content: space-between; }
    
    .btn {
      padding: 14px 32px;
      border-radius: 50px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
    }
    .btn-primary { background: var(--jde-brown); color: white; }
    .btn-primary:hover { background: #503000; }
    .btn-primary:disabled { background: #ddd; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: var(--jde-brown); }

    .progress { height: 6px; background: #eee; border-radius: 10px; margin-bottom: 30px; overflow: hidden; }
    .progress-bar { height: 100%; background: var(--jde-gold); transition: width 0.4s ease; }

    /* Results Layout */
    .results-grid { 
      display: grid; 
      gap: 24px; 
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
    }
    
    .machine-card {
      background: white;
      border-radius: 16px;
      border: 1px solid #eee;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      transition: all 0.3s ease;
      overflow: hidden;
      height: 100%;
    }
    .machine-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(51,30,0,0.15);
      border-color: var(--jde-gold);
    }
    
    .m-image-container {
      background: #fff;
      height: 200px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      border-bottom: 1px solid #f0f0f0;
    }
    
    .m-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: transform 0.3s ease;
    }
    .machine-card:hover .m-image { transform: scale(1.05); }

    .m-body { padding: 20px; flex-grow: 1; display:flex; flex-direction:column; }
    .m-tag { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: 800; color: var(--jde-gold); margin-bottom: 8px; display: block; }
    .m-title { font-weight: 800; font-size: 1.2rem; margin-bottom: 12px; line-height: 1.2; color: var(--jde-brown); }
    
    .m-specs { list-style: none; padding: 0; margin: 0 0 16px 0; font-size: 0.85rem; color: #555; flex-grow: 1; }
    .m-specs li { margin-bottom: 6px; padding-left: 18px; position: relative; }
    .m-specs li::before { content: "✓"; color: var(--jde-gold); position: absolute; left: 0; font-weight: bold; }

    .m-link { background: var(--jde-brown); color: white; text-align: center; padding: 12px; font-weight: 600; font-size: 0.9rem; border-radius: 8px; margin-top: auto; }

    /* Loader */
    .loader { width: 50px; height: 50px; border: 5px solid var(--jde-cream); border-top-color: var(--jde-brown); border-radius: 50%; animation: spin 1s infinite linear; margin: 0 auto 20px; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    @media(max-width: 600px){
      .app-card { padding: 20px; min-height: auto; }
      .footer-nav { flex-direction: column-reverse; gap: 16px; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>

<div class="container">
  <a href="index.html" style="display: inline-block; margin-bottom: 10px; text-decoration: none; color: var(--jde-brown); font-weight: 600; font-size: 0.9rem; border: 1px solid rgba(51,30,0,0.15); padding: 8px 16px; border-radius: 50px; background: rgba(255,255,255,0.6); transition: all 0.2s;" onmouseover="this.style.background='#fff'; this.style.transform='translateX(-3px)'" onmouseout="this.style.background='rgba(255,255,255,0.6)'; this.style.transform='none'">
    ← Zurück zur Startseite
  </a>
  
  <div class="center" style="margin-bottom: 30px;">
    <span style="font-weight:800; font-size:26px; color:var(--jde-brown)">JDE</span> 
    <span style="font-weight:400; font-size:26px; color:var(--jde-gold)">Professional</span>
  </div>

  <div id="app" class="app-card"></div>
</div>

<script>
/**
 * DATENBANK (Maschinen & Fragen bleiben gleich)
 */
const allMachines = [
  // -- BOHNEN (BEAN) --
  { id: 'wmf950', name: 'WMF 950 S', type: 'bean', milk: 'fresh', water: 'tank', tags: ['Einstieg', 'Tank'], specs: ['Wassertank integriert', 'Bis 50 Tassen/Tag', 'Kompaktes Design'], url: 'https://www2.jacobs-professional.de/produkt/wmf-950s', image: 'https://placehold.co/400x400/F6EADC/331E00?text=WMF+950+S' },
  { id: 'wittenborg100', name: 'Wittenborg W100', type: 'bean', milk: 'fresh', water: 'both', tags: ['Design', 'Office'], specs: ['Frischmilch', 'Glasfront', 'Festwasser optional'], url: 'https://www2.jacobs-professional.de/produkt/Wittenborg-W100', image: 'https://placehold.co/400x400/F6EADC/331E00?text=Wittenborg+W100' },
  { id: 'club', name: 'Schaerer Coffee Club', type: 'bean', milk: 'both', water: 'both', tags: ['Flexibel', 'Touch'], specs: ['Slim Design', 'Easy Clean', 'Tank oder Festwasser'], url: 'https://www2.jacobs-professional.de/produkt/Schaerer-Coffee-Club', image: 'https://placehold.co/400x400/F6EADC/331E00?text=Schaerer+Club' },
  { id: 'skye', name: 'Schaerer Coffee Skye', type: 'bean', milk: 'fresh', water: 'both', tags: ['Mittelstand', 'Flexibel'], specs: ['Großer Wassertank', 'Beweglicher Screen', 'Maschine on Wheels'], url: 'https://www2.jacobs-professional.de/produkt/schaerer-coffee-skye', image: 'https://placehold.co/400x400/F6EADC/331E00?text=Schaerer+Skye' },
  { id: 'soul', name: 'Schaerer Coffee Soul', type: 'bean', milk: 'fresh', water: 'fixed', tags: ['High-End', 'Performance'], specs: ['Best Foam™', 'Video-Display', 'Festwasser empfohlen'], url: 'https://www2.jacobs-professional.de/produkt/schaerer-coffee-soul', image: 'https://placehold.co/400x400/F6EADC/331E00?text=Schaerer+Soul' },
  { id: 'wmf1100f', name: 'WMF 1100S Frischmilch', type: 'bean', milk: 'fresh', water: 'both', tags: ['Profi', 'Marke'], specs: ['WMF Profi-Brüher', 'Großer Tank oder Festwasser', 'App-Steuerung'], url: 'https://www2.jacobs-professional.de/produkt/wmf-1100s-frischmilch', image: 'https://placehold.co/400x400/F6EADC/331E00?text=WMF+1100S' },
  { id: 'wmf1100i', name: 'WMF 1100S Topping', type: 'bean', milk: 'topping', water: 'both', tags: ['Wartungsarm', 'Office'], specs: ['Topping-Pulver', 'Nur 1x wöchentlich reinigen', 'Kompakt'], url: 'https://www2.jacobs-professional.de/produkt/wmf-1100s-instantmilch', image: 'https://placehold.co/400x400/F6EADC/331E00?text=WMF+1100S+Topping' },
  // -- LIQUID --
  { id: 'caf_exc_touch', name: 'Excellence Touch', type: 'liquid', milk: 'liquid', water: 'fixed', tags: ['High-Speed', 'Eco'], specs: ['12 Sek/Tasse', 'Energiesparmodus', 'Festwasser nötig'], url: 'https://www2.jacobs-professional.de/produkt/cafitessee-excellence-touch-experience', image: 'https://placehold.co/400x400/F6EADC/331E00?text=Excellence+Touch' },
  { id: 'caf_compact', name: 'Excellence Compact', type: 'liquid', milk: 'liquid', water: 'both', tags: ['Kompakt', 'Schnell'], specs: ['Plug & Play', 'Tankbetrieb möglich', 'Kein Trester'], url: 'https://www2.jacobs-professional.de/produkt/Cafitesse-Excellence-Compact-Touch-Experience', image: 'https://placehold.co/400x400/F6EADC/331E00?text=Excellence+Compact' },
  { id: 'caf_quant300', name: 'Quantum Touch 300', type: 'liquid', milk: 'liquid', water: 'fixed', tags: ['Industrie', 'Menge'], specs: ['Massive Leistung', 'Festwasser zwingend', 'Für Kannen'], url: 'https://www2.jacobs-professional.de/produkt/cafitesse-quantum-touch-300', image: 'https://placehold.co/400x400/F6EADC/331E00?text=Quantum+300' },
  // -- KAPSEL/PAD --
  { id: 'lor_mini', name: 'L\'OR Mini', type: 'capsule', milk: 'none', water: 'tank', tags: ['Premium', 'Kapsel'], specs: ['Aluminium Kapseln', 'Klein & Edel', 'Tankbetrieb'], url: 'https://www2.jacobs-professional.de/produkt/lor-mini-kapselmaschine', image: 'https://placehold.co/400x400/F6EADC/331E00?text=LOR+Mini' },
  { id: 'senseo_maestro', name: 'Senseo Maestro', type: 'pad', milk: 'none', water: 'tank', tags: ['Pad', 'Eco'], specs: ['Kompostierbare Pads', 'Auto-Off Funktion', 'Günstig'], url: 'https://www2.jacobs-professional.de/produkt/senseo-maestro', image: 'https://placehold.co/400x400/F6EADC/331E00?text=Senseo+Maestro' },
  // -- MOBILE --
  { id: 'barista_mobil', name: 'Barista Mobil', type: 'mobile', water: 'tank', tags: ['Event', 'Mobil'], specs: ['Autarker Betrieb', 'Inkl. Wassertanks', 'Rollen'], url: 'https://www2.jacobs-professional.de/produkt/jacobs-barista-mobil', image: 'https://placehold.co/400x400/F6EADC/331E00?text=Barista+Mobil' }
];

const questions = [
  { id: 'einsatz', title: '1. Einsatzbereich', options: [ { id: 'office', label: 'Büro / Firma', icon: '🏢' }, { id: 'gastro', label: 'Gastronomie', icon: '🍽️' }, { id: 'care', label: 'Klinik / Pflege', icon: '⚕️' }, { id: 'event', label: 'Event / Mobil', icon: '🎉' } ] },
  { id: 'menge', title: '2. Tagesbedarf', condition: (a) => a.einsatz !== 'event', options: [ { id: 'small', label: 'Bis 30 Tassen', icon: '☕', sub: 'Kleines Team' }, { id: 'medium', label: '30 – 80 Tassen', icon: '📈', sub: 'Abteilung' }, { id: 'large', label: 'Über 80 Tassen', icon: '🏭', sub: 'Großraum' } ] },
  { id: 'art', title: '3. Priorität', condition: (a) => a.einsatz !== 'event', options: [ { id: 'quality', label: 'Qualität (Bohne)', icon: '🥇', sub: 'Wie vom Barista' }, { id: 'speed', label: 'Schnelligkeit', icon: '⚡', sub: 'Keine Wartezeiten' }, { id: 'easy', label: 'Einfachheit', icon: '👌', sub: 'Wenig Pflege' }, { id: 'filter', label: 'Filterkaffee', icon: '🫖', sub: 'Kannenbrühung' } ] },
  { id: 'milch', title: '4. Milchsystem', condition: (a) => (a.art === 'quality' || a.einsatz === 'gastro') && a.einsatz !== 'event', options: [ { id: 'fresh', label: 'Frischmilch', icon: '🥛', sub: 'Bester Geschmack' }, { id: 'topping', label: 'Milchpulver', icon: '🍚', sub: 'Hygienisch' }, { id: 'none', label: 'Nur Schwarz', icon: '☕', sub: 'Keine Milch nötig' } ] },
  { id: 'finance', title: '5. Budget & Finanzierung', condition: (a) => a.einsatz !== 'event', options: [ { id: 'buy', label: 'Kauf', icon: '💶', sub: 'Direkter Erwerb' }, { id: 'lease', label: 'Leasing / Miete', icon: '📝', sub: 'Monatliche Rate' }, { id: 'ppc', label: 'Pay-per-Cup', icon: '☕', sub: 'Pro Tasse zahlen' } ] },
  { id: 'space', title: '6. Standort & Anschlüsse', condition: (a) => a.einsatz !== 'event', options: [ { id: 'full', label: 'Festwasser & Platz', icon: '🚰', sub: 'Alles vorhanden' }, { id: 'tank', label: 'Nur Steckdose', icon: '🔌', sub: 'Tankbetrieb nötig' }, { id: 'compact', label: 'Begrenzter Platz', icon: '📏', sub: 'Kompakt nötig' } ] },
  { id: 'eco', title: '7. Nachhaltigkeit', condition: (a) => a.einsatz !== 'event', options: [ { id: 'standard', label: 'Standard', icon: '✔️', sub: 'Gute Effizienz' }, { id: 'high', label: 'Hohe Priorität', icon: '🌱', sub: 'Eco-Modus & Müllvermeidung' } ] }
];

// STATE: Added 'emailEntered' flag
let state = { step: 0, answers: {}, loading: false, emailEntered: false, userEmail: '' };
const app = document.getElementById('app');

function render() {
  // 1. Loading Animation
  if (state.loading) {
    app.innerHTML = `<div class="center" style="padding:100px 0"><div class="loader"></div><h2>Analysiere Antworten...</h2></div>`;
    return;
  }

  // 2. CHECK: Sind alle Fragen beantwortet?
  if (state.step >= questions.length) {
    // 2a. Ist die E-Mail schon eingegeben? NEIN -> Zeige Formular
    if (!state.emailEntered) {
      renderLeadForm();
      return;
    }
    // 2b. Ist E-Mail da? JA -> Zeige Ergebnisse
    renderResults();
    return;
  }

  // 3. Question Rendering
  const q = questions[state.step];
  if (q.condition && !q.condition(state.answers)) {
    state.step++;
    render();
    return;
  }

  const progress = ((state.step + 1) / questions.length) * 100;
  let html = `
    <div class="progress"><div class="progress-bar" style="width:${progress}%"></div></div>
    <h2 class="center">${q.title}</h2>
    <div class="grid" style="margin-top:32px">
  `;
  q.options.forEach(opt => {
    const isSel = isSelected(q.id, opt.id);
    html += `
      <div class="option-btn ${isSel ? 'selected' : ''}" onclick="select('${q.id}', '${opt.id}')">
        <span class="option-icon">${opt.icon}</span>
        <span class="option-label">${opt.label}</span>
        ${opt.sub ? `<span class="option-sub">${opt.sub}</span>` : ''}
      </div>
    `;
  });
  html += `</div>
    <div class="footer-nav">
      <button class="btn btn-ghost" onclick="prev()" ${state.step===0?'disabled':''}>Zurück</button>
      <button class="btn btn-primary" onclick="next()" id="nextBtn" ${!canNext(q.id)?'disabled':''}>Weiter</button>
    </div>
  `;
  app.innerHTML = html;
}

// --- NEW FUNCTION: RENDER EMAIL FORM ---
function renderLeadForm() {
  app.innerHTML = `
    <div class="center" style="max-width:500px; margin:40px auto; padding:20px;">
      <div style="font-size:50px; margin-bottom:20px">🔒</div>
      <h2>Fast geschafft!</h2>
      <p>Ihre persönliche Kaffeemaschinen-Empfehlung wurde berechnet.</p>
      <p style="color:#666; margin-bottom:30px">Bitte geben Sie Ihre E-Mail-Adresse ein, um die Auswertung sofort anzuzeigen.</p>
      
      <div style="margin-bottom:20px; text-align:left;">
        <label style="font-weight:bold; display:block; margin-bottom:8px">Geschäftliche E-Mail Adresse *</label>
        <input type="email" id="emailInput" placeholder="name@firma.de" style="width:100%; padding:14px; border:1px solid #ccc; border-radius:8px; font-size:16px;">
      </div>
      
      <button onclick="submitEmail()" class="btn btn-primary" style="width:100%; font-size:18px;">Ergebnis anzeigen</button>
      
      <p style="font-size:11px; color:#999; margin-top:20px">Wir verwenden Ihre Daten vertraulich gemäß unserer Datenschutzerklärung.</p>
    </div>
  `;
}

// --- NEW FUNCTION: HANDLE EMAIL SUBMIT ---
function submitEmail() {
  const email = document.getElementById('emailInput').value;
  if (!email || !email.includes('@') || email.length < 5) {
    alert('Bitte geben Sie eine gültige E-Mail Adresse ein.');
    return;
  }
  // Hier könnte man die E-Mail später an ein Backend senden
  state.userEmail = email;
  state.emailEntered = true;
  state.loading = true; // Kurzer Fake-Load für Effekt
  render();
  setTimeout(() => { state.loading = false; render(); }, 800);
}

// --- STANDARD LOGIC ---
function select(qId, optId) {
  state.answers[qId] = optId;
  setTimeout(next, 250); 
  render();
}
function isSelected(qId, optId) { return state.answers[qId] === optId; }
function canNext(qId) { return !!state.answers[qId]; }

function next() {
  state.step++;
  // Wenn wir fertig sind, zeige Lade-Animation VOR der Email-Abfrage
  if (state.step >= questions.length && !state.emailEntered) {
    state.loading = true;
    render();
    setTimeout(() => { state.loading = false; render(); }, 1500);
  } else {
    render();
  }
}

function prev() {
  if (state.step > 0) {
    state.step--;
    const q = questions[state.step];
    if (q.condition && !q.condition(state.answers)) state.step--;
    render();
  }
}

function getResults() {
  const a = state.answers;
  let matches = allMachines.filter(m => {
    if (a.einsatz === 'event') return m.type === 'mobile';
    if (m.type === 'mobile') return false;
    if (a.menge === 'small') {
      if (['capsule', 'pad'].includes(m.type) || m.id === 'wmf950') return true;
      return false;
    }
    if (a.space === 'tank' && m.water === 'fixed') return false;
    if (a.space === 'compact' && (m.tags.includes('Menge') || m.id === 'soul' || m.id === 'caf_exc_touch')) return false;
    if (a.art === 'speed') return m.type === 'liquid';
    if (a.art === 'quality') {
       if (m.type !== 'bean') return false;
       if (a.milch === 'fresh' && m.milk !== 'fresh' && m.milk !== 'both') return false;
       if (a.milch === 'topping' && m.milk !== 'topping' && m.milk !== 'both') return false;
       return true;
    }
    if (a.eco === 'high' && m.type === 'capsule') return false;
    return true;
  });
  if (a.menge === 'medium') matches = matches.filter(m => !['capsule','pad'].includes(m.type));
  if (a.menge === 'large') matches = matches.filter(m => m.tags.includes('Industrie') || m.tags.includes('Profi') || m.tags.includes('Performance'));
  return matches.slice(0, 4);
}

function renderResults() {
  const results = getResults();
  const financeModel = state.answers.finance === 'ppc' ? 'Pay-per-Cup Modell' : (state.answers.finance === 'lease' ? 'Leasing-Angebot' : 'Kauf-Angebot');
  
  let html = `
    <div class="center">
      <h2>Ihre maßgeschneiderte Lösung</h2>
      <p>Passend zu Ihrem Standort und dem gewünschten <strong>${financeModel}</strong>.</p>
    </div>
    <div class="results-grid">
  `;
  if(results.length === 0) {
    html += `<p class="center">Für Ihre spezifischen Anforderungen kontaktieren Sie bitte unseren Kundenservice.</p>`;
  } else {
    results.forEach(m => {
      const specsHtml = m.specs ? m.specs.map(s => `<li>${s}</li>`).join('') : '';
      html += `
        <a href="${m.url}" target="_blank" class="machine-card">
          <div class="m-image-container">
            <img src="${m.image}" alt="${m.name}" class="m-image" onerror="this.src='https://placehold.co/400x300?text=JDE+Machine'">
          </div>
          <div class="m-body">
            <span class="m-tag">${m.tags.join(' • ')}</span>
            <div class="m-title">${m.name}</div>
            <ul class="m-specs">${specsHtml}</ul>
            <div class="m-link">Zum Produkt ↗</div>
          </div>
        </a>
      `;
    });
  }
  html += `</div>
    <div class="center" style="margin-top:40px">
      <button class="btn btn-ghost" onclick="location.reload()">Neustart</button>
    </div>`;
  app.innerHTML = html;
}

render();
</script>
</body>
</html>
