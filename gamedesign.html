  <style>
    :root {
      /* JDE Colors */
      --jde-brown: #331E00;
      --jde-gold: #C89A4B;
      --jde-cream: #F6EADC;
      --jde-grey: #f9f9f9;
      
      --bg-gradient: radial-gradient(circle at top left, #F6EADC 0, #ffffff 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --shadow: 0 10px 40px rgba(51, 30, 0, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-gradient);
      color: var(--jde-brown);
      min-height: 100vh;
      padding: 20px;
      line-height: 1.5;
    }

    .container { max-width: 1100px; margin: 0 auto; }
    .center { text-align: center; }

    /* Main App Card */
    .app-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 40px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,0.8);
      min-height: 650px;
      display: flex;
      flex-direction: column;
    }

    h1, h2 { color: var(--jde-brown); margin-top: 0; }
    h2 { font-size: 22px; font-weight: 700; margin-bottom: 24px; }
    
    /* Interactive Grid */
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
    
    .option-btn {
      background: #fff;
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 16px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
    }
    .option-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.08);
      border-color: var(--jde-gold);
    }
    .option-btn.selected {
      background: var(--jde-cream);
      border-color: var(--jde-brown);
      box-shadow: inset 0 0 0 2px var(--jde-brown);
    }
    .option-icon { font-size: 32px; margin-bottom: 12px; display: block; }
    .option-label { font-weight: 700; display: block; margin-bottom: 4px; font-size: 0.95rem; }
    .option-sub { font-size: 0.8rem; color: #666; display: block; line-height: 1.3; }

    /* Navigation */
    .footer-nav { margin-top: auto; padding-top: 40px; display: flex; justify-content: space-between; }
    
    .btn {
      padding: 14px 32px;
      border-radius: 50px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
    }
    .btn-primary { background: var(--jde-brown); color: white; }
    .btn-primary:hover { background: #503000; }
    .btn-primary:disabled { background: #ddd; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: var(--jde-brown); }

    .progress { height: 6px; background: #eee; border-radius: 10px; margin-bottom: 30px; overflow: hidden; }
    .progress-bar { height: 100%; background: var(--jde-gold); transition: width 0.4s ease; }

    /* Results Layout */
    .results-grid { 
      display: grid; 
      gap: 24px; 
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
    }
    
    .machine-card {
      background: white;
      border-radius: 16px;
      border: 1px solid #eee;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      transition: all 0.3s ease;
      overflow: hidden;
      height: 100%;
    }
    .machine-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(51,30,0,0.15);
      border-color: var(--jde-gold);
    }
    
    .m-image-container {
      background: #fff;
      height: 200px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      border-bottom: 1px solid #f0f0f0;
    }
    
    .m-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: transform 0.3s ease;
    }
    .machine-card:hover .m-image { transform: scale(1.05); }

    .m-body { padding: 20px; flex-grow: 1; display:flex; flex-direction:column; }
    .m-tag { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: 800; color: var(--jde-gold); margin-bottom: 8px; display: block; }
    .m-title { font-weight: 800; font-size: 1.2rem; margin-bottom: 12px; line-height: 1.2; color: var(--jde-brown); }
    
    .m-specs { list-style: none; padding: 0; margin: 0 0 16px 0; font-size: 0.85rem; color: #555; flex-grow: 1; }
    .m-specs li { margin-bottom: 6px; padding-left: 18px; position: relative; }
    .m-specs li::before { content: "✓"; color: var(--jde-gold); position: absolute; left: 0; font-weight: bold; }

    .m-link { background: var(--jde-brown); color: white; text-align: center; padding: 12px; font-weight: 600; font-size: 0.9rem; border-radius: 8px; margin-top: auto; }

    /* Loader */
    .loader { width: 50px; height: 50px; border: 5px solid var(--jde-cream); border-top-color: var(--jde-brown); border-radius: 50%; animation: spin 1s infinite linear; margin: 0 auto 20px; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    @media(max-width: 600px){
      .app-card { padding: 20px; min-height: auto; }
      .footer-nav { flex-direction: column-reverse; gap: 16px; }
      .btn { width: 100%; }
    }
  </style>
</head>

let state = { step: 0, answers: {}, loading: false };
const app = document.getElementById('app');

function render() {
  if (state.loading) {
    app.innerHTML = `<div class="center" style="padding:100px 0"><div class="loader"></div><h2>Analysiere Standort & Budget...</h2></div>`;
    return;
  }

  if (state.step >= questions.length) {
    renderResults();
    return;
  }

  const q = questions[state.step];
  if (q.condition && !q.condition(state.answers)) {
    state.step++;
    render();
    return;
  }

  const progress = ((state.step + 1) / questions.length) * 100;

  let html = `
    <div class="progress"><div class="progress-bar" style="width:${progress}%"></div></div>
    <h2 class="center">${q.title}</h2>
    <div class="grid" style="margin-top:32px">
  `;

  q.options.forEach(opt => {
    const isSel = isSelected(q.id, opt.id);
    html += `
      <div class="option-btn ${isSel ? 'selected' : ''}" onclick="select('${q.id}', '${opt.id}')">
        <span class="option-icon">${opt.icon}</span>
        <span class="option-label">${opt.label}</span>
        ${opt.sub ? `<span class="option-sub">${opt.sub}</span>` : ''}
      </div>
    `;
  });

  html += `</div>
    <div class="footer-nav">
      <button class="btn btn-ghost" onclick="prev()" ${state.step===0?'disabled':''}>Zurück</button>
      <button class="btn btn-primary" onclick="next()" id="nextBtn" ${!canNext(q.id)?'disabled':''}>Weiter</button>
    </div>
  `;
  app.innerHTML = html;
}

function select(qId, optId) {
  state.answers[qId] = optId;
  setTimeout(next, 250); // Auto forward
  render();
}

function isSelected(qId, optId) { return state.answers[qId] === optId; }
function canNext(qId) { return !!state.answers[qId]; }

function next() {
  state.step++;
  if (state.step >= questions.length) {
    state.loading = true;
    render();
    setTimeout(() => { state.loading = false; render(); }, 1500);
  } else {
    render();
  }
}

function prev() {
  if (state.step > 0) {
    state.step--;
    const q = questions[state.step];
    if (q.condition && !q.condition(state.answers)) state.step--;
    render();
  }
}

function getResults() {
  const a = state.answers;

    if (a.einsatz === 'event') return m.type === 'mobile';
    if (m.type === 'mobile') return false;

    if (a.menge === 'small') {
      if (['capsule', 'pad'].includes(m.type)) return true;
      if (m.id === 'wmf950') return true;
      return false;
    }

    // 3. Standort-Filter (Space/Water)
    // Wenn 'Nur Steckdose' gewählt wurde, schließe reine Festwasser-Maschinen aus
    if (a.space === 'tank' && m.water === 'fixed') return false;
    // Wenn 'Begrenzter Platz', schließe große Maschinen aus
    if (a.space === 'compact' && (m.tags.includes('Menge') || m.id === 'soul' || m.id === 'caf_exc_touch')) return false;

    // 4. Technologie
    if (a.art === 'speed') return m.type === 'liquid';
    if (a.art === 'quality') {
       if (m.type !== 'bean') return false;
       if (a.milch === 'fresh' && m.milk !== 'fresh' && m.milk !== 'both') return false;
       if (a.milch === 'topping' && m.milk !== 'topping' && m.milk !== 'both') return false;
       return true;
    }
    
    // 5. Nachhaltigkeits-Logik (Kapseln vermeiden bei hoher Prio)
    if (a.eco === 'high' && m.type === 'capsule') return false;

    return true;
  });

  // Nachfilterung Menge
  if (a.menge === 'medium') matches = matches.filter(m => !['capsule','pad'].includes(m.type));
  if (a.menge === 'large') matches = matches.filter(m => m.tags.includes('Industrie') || m.tags.includes('Profi') || m.tags.includes('Performance'));

  return matches.slice(0, 4);
}

function renderResults() {
  const results = getResults();
  const financeModel = state.answers.finance === 'ppc' ? 'Pay-per-Cup Modell' : (state.answers.finance === 'lease' ? 'Leasing-Angebot' : 'Kauf-Angebot');
  
  let html = `
    <div class="center">
      <h2>Ihre maßgeschneiderte Lösung</h2>
      <p>Passend zu Ihrem Standort und dem gewünschten <strong>${financeModel}</strong>.</p>
    </div>
    <div class="results-grid">
  `;
  
  if(results.length === 0) {
    html += `<p class="center">Für Ihre spezifischen Standort-Anforderungen kontaktieren Sie bitte direkt unseren Kundenservice.</p>`;
  } else {
    results.forEach(m => {
      const specsHtml = m.specs ? m.specs.map(s => `<li>${s}</li>`).join('') : '';
      
      html += `
        <a href="${m.url}" target="_blank" class="machine-card">
          <div class="m-image-container">
            <img src="${m.image}" alt="${m.name}" class="m-image" onerror="this.src='https://placehold.co/400x300?text=JDE+Machine'">
          </div>
          <div class="m-body">
            <span class="m-tag">${m.tags.join(' • ')}</span>
            <div class="m-title">${m.name}</div>
            <ul class="m-specs">${specsHtml}</ul>
            <div class="m-link">Zum Produkt ↗</div>
          </div>
        </a>
      `;
    });
  }
  
  html += `</div>
    <div class="center" style="margin-top:40px">
      <button class="btn btn-ghost" onclick="location.reload()">Neustart</button>
    </div>`;
    
  app.innerHTML = html;
}

render();
</script>
</body>
</html>
