<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Premium Kaffeemaschinen-Berater | JDE Professional</title>
  <style>
    :root {
      /* JDE Corporate Identity */
      --jde-brown: #331E00;
      --jde-gold: #C89A4B;
      --jde-cream: #F6EADC;
      --jde-offwhite: #FFFDFA;
      
      --bg-gradient: radial-gradient(circle at top left, #F6EADC 0, #FFFDFA 40%, #ffffff 100%);
      --card-bg: rgba(255, 255, 255, 0.95);
      --text-main: var(--jde-brown);
      --text-muted: rgba(51, 30, 0, 0.6);
      --border-color: rgba(51, 30, 0, 0.1);
      
      --anim-speed: 0.3s;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px;
      line-height: 1.5;
    }

    .container { max-width: 850px; margin: 0 auto; }
    .center { text-align: center; }

    /* Glassmorphism Card */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(51, 30, 0, 0.08);
      border: 1px solid rgba(255,255,255,0.8);
      transition: height 0.3s ease;
    }

    /* Typography */
    h1 { font-size: clamp(24px, 4vw, 36px); margin: 0 0 16px; color: var(--jde-brown); }
    h2 { font-size: 22px; margin: 0 0 24px; font-weight: 600; }
    p { margin-bottom: 24px; color: var(--text-muted); }

    /* Grid Layouts */
    .grid { display: grid; gap: 16px; }
    .cols-2 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .cols-3 { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }

    /* Interactive Elements */
    .option-btn {
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .option-btn:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(51, 30, 0, 0.1);
      border-color: var(--jde-gold);
    }

    .option-btn.selected {
      background: var(--jde-cream);
      border-color: var(--jde-brown);
      box-shadow: 0 0 0 2px var(--jde-brown) inset;
    }

    .option-icon { font-size: 32px; margin-bottom: 12px; }
    .option-label { font-weight: 600; font-size: 1.05rem; display: block; }
    .option-desc { font-size: 0.85rem; color: var(--text-muted); margin-top: 6px; }

    /* Progress Bar */
    .progress-container {
      height: 6px;
      background: rgba(51,30,0,0.05);
      border-radius: 99px;
      margin: 20px 0 40px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: var(--jde-gold);
      transition: width 0.5s ease;
    }

    /* Buttons */
    .actions { display: flex; justify-content: space-between; margin-top: 40px; align-items: center; }
    
    .btn {
      padding: 14px 28px;
      border-radius: 99px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
      font-size: 1rem;
    }
    
    .btn-primary {
      background: var(--jde-brown);
      color: #fff;
      box-shadow: 0 4px 12px rgba(51, 30, 0, 0.2);
    }
    .btn-primary:hover { transform: translateY(-2px); background: #4a2c00; }
    .btn-primary:disabled { background: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }

    .btn-ghost { background: transparent; color: var(--text-muted); }
    .btn-ghost:hover { color: var(--jde-brown); background: rgba(51,30,0,0.05); }

    /* Result Cards */
    .machine-card {
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      transition: transform 0.2s;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .machine-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.1);
      border-color: var(--jde-gold);
    }
    .machine-header {
      background: var(--jde-cream);
      padding: 20px;
      text-align: center;
      font-size: 40px;
    }
    .machine-body { padding: 20px; flex-grow: 1; }
    .machine-name { font-weight: 700; font-size: 1.1rem; margin-bottom: 8px; color: var(--jde-brown); display:block;}
    .machine-tag { 
      display: inline-block; font-size: 0.75rem; background: var(--jde-brown); color: white; 
      padding: 4px 8px; border-radius: 4px; margin-bottom: 12px;
    }
    .machine-link {
        margin-top: auto;
        padding: 12px;
        text-align: center;
        background: var(--jde-brown);
        color: white;
        font-size: 0.9rem;
        font-weight: 600;
    }

    /* Loading Animation */
    .loader {
      display: inline-block;
      width: 48px;
      height: 48px;
      border: 5px solid var(--jde-cream);
      border-bottom-color: var(--jde-brown);
      border-radius: 50%;
      animation: rotation 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Form Styles */
    .input-group { margin-bottom: 16px; text-align: left; }
    .input-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; }
    .input-group input, .input-group textarea {
      width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px;
      font-size: 1rem; outline: none; transition: border-color 0.2s;
    }
    .input-group input:focus { border-color: var(--jde-gold); }

    /* Mobile */
    @media (max-width: 600px) {
      .card { padding: 24px; border-radius: 16px; }
      .actions { flex-direction: column-reverse; gap: 16px; }
      .btn { width: 100%; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="center" style="margin-bottom: 20px;">
    <div style="font-weight: 800; font-size: 24px; color: var(--jde-brown); letter-spacing: -1px;">
      JDE <span style="color:var(--jde-gold)">Professional</span>
    </div>
    <div style="font-size: 12px; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted);">Maschinen-Berater</div>
  </div>

  <div id="app" class="card">
    </div>
  
  <footer class="center" style="margin-top: 32px; font-size: 12px; color: var(--text-muted);">
    © 2025 Jacobs Douwe Egberts Professional | Demo Projekt
  </footer>
</div>

<script>
/**
 * KONFIGURATION & DATEN
 */
const questions = [
  {
    id: 'branche',
    title: 'In welcher Branche sind Sie tätig?',
    subtitle: 'Wählen Sie Ihren Bereich aus.',
    options: [
      { id: 'buero', label: 'Büro / Agentur', icon: '🏢' },
      { id: 'gastro', label: 'Gastronomie / Hotel', icon: '🍽️' },
      { id: 'care', label: 'Pflege / Klinik', icon: '⚕️' },
      { id: 'industrie', label: 'Industrie / Produktion', icon: '🏭' }
    ]
  },
  {
    id: 'mitarbeiter',
    title: 'Wie viele Personen versorgen Sie täglich?',
    subtitle: 'Mitarbeiter und Gäste zusammen.',
    options: [
      { id: 'small', label: 'Bis 15 Personen', icon: '👥', desc: 'Kleines Team / Wartezimmer' },
      { id: 'medium', label: '16 – 50 Personen', icon: '🏢', desc: 'Mittlere Abteilung / Café' },
      { id: 'large', label: '51 – 200 Personen', icon: '🏭', desc: 'Etage / Großer Bereich' },
      { id: 'xl', label: 'Über 200 Personen', icon: '🏟️', desc: 'Kantine / Großveranstaltung' }
    ]
  },
  {
    id: 'getraenke',
    title: 'Was soll die Maschine können?',
    subtitle: 'Mehrfachauswahl möglich.',
    multi: true,
    options: [
      { id: 'kaffee', label: 'Kaffee Schwarz', icon: '☕' },
      { id: 'milch', label: 'Cappuccino / Latte', icon: '🥛' },
      { id: 'kakao', label: 'Kakao', icon: '🍫' },
      { id: 'tee', label: 'Heißwasser / Tee', icon: '🍵' }
    ]
  },
  {
    id: 'features',
    title: 'Zusätzliche Anforderungen?',
    subtitle: 'Was ist Ihnen besonders wichtig?',
    multi: true,
    options: [
      { id: 'festwasser', label: 'Festwasseranschluss', icon: '🚰', desc: 'Kein Tank-Nachfüllen' },
      { id: 'payment', label: 'Bezahlsystem', icon: '💳', desc: 'Münzen oder Karte' },
      { id: 'nachhaltig', label: 'Nachhaltigkeit', icon: '🌱', desc: 'Bio / Fairtrade Fokus' },
      { id: 'speed', label: 'Hohe Geschwindigkeit', icon: '⚡', desc: 'Schnelle Ausgabe' }
    ]
  }
];

// State Management
let state = {
  step: 0,
  answers: {},
  loading: false
};

const app = document.getElementById('app');

/**
 * RENDER ENGINE
 */
function render() {
  // 1. Loading Screen
  if (state.loading) {
    app.innerHTML = `
      <div class="center" style="padding: 40px 0;">
        <div class="loader"></div>
        <h2>Analysiere Anforderungen...</h2>
        <p>Wir suchen die passende Lösung aus unserem Portfolio.</p>
      </div>
    `;
    return;
  }

  // 2. Result Screen
  if (state.step >= questions.length) {
    renderResults();
    return;
  }

  // 3. Question Screen
  const q = questions[state.step];
  const progress = ((state.step + 1) / (questions.length + 1)) * 100;
  
  let html = `
    <div class="progress-container"><div class="progress-bar" style="width: ${progress}%"></div></div>
    <h2>${q.title}</h2>
    <p>${q.subtitle}</p>
    <div class="grid ${q.options.length > 2 ? 'cols-2' : 'grid'}">
  `;

  q.options.forEach(opt => {
    const isSelected = isOptionSelected(q.id, opt.id);
    html += `
      <div class="option-btn ${isSelected ? 'selected' : ''}" onclick="handleSelection('${q.id}', '${opt.id}', ${q.multi})">
        <div class="option-icon">${opt.icon}</div>
        <span class="option-label">${opt.label}</span>
        ${opt.desc ? `<span class="option-desc">${opt.desc}</span>` : ''}
      </div>
    `;
  });

  html += `</div>`;

  // Navigation Buttons
  html += `<div class="actions">
    <button class="btn btn-ghost" onclick="prevStep()" ${state.step === 0 ? 'style="visibility:hidden"' : ''}>← Zurück</button>
    <button class="btn btn-primary" onclick="nextStep()" id="nextBtn" ${!canProceed(q.id) ? 'disabled' : ''}>
      ${state.step === questions.length - 1 ? 'Analyse starten' : 'Weiter'}
    </button>
  </div>`;

  app.innerHTML = html;
}

/**
 * LOGIC HANDLERS
 */
function handleSelection(qId, optId, isMulti) {
  if (!state.answers[qId]) state.answers[qId] = isMulti ? [] : null;

  if (isMulti) {
    const idx = state.answers[qId].indexOf(optId);
    if (idx > -1) state.answers[qId].splice(idx, 1);
    else state.answers[qId].push(optId);
  } else {
    state.answers[qId] = optId;
    // Auto-advance for single choice adds smooth flow
    setTimeout(() => nextStep(), 250); 
  }
  render();
}

function isOptionSelected(qId, optId) {
  const val = state.answers[qId];
  if (Array.isArray(val)) return val.includes(optId);
  return val === optId;
}

function canProceed(qId) {
  const val = state.answers[qId];
  if (Array.isArray(val)) return val.length > 0;
  return !!val;
}

function prevStep() {
  if (state.step > 0) {
    state.step--;
    render();
  }
}

function nextStep() {
  const q = questions[state.step];
  if (!canProceed(q.id)) return;

  if (state.step < questions.length - 1) {
    state.step++;
    render();
  } else {
    // Finish -> Fake Loading
    state.loading = true;
    render();
    setTimeout(() => {
      state.loading = false;
      state.step++; // Move to results
      render();
    }, 1500);
  }
}

/**
 * RECOMMENDATION ENGINE
 */
function getRecommendation() {
  const ans = state.answers;
  let category = "Standard";
  let reason = "Basierend auf Ihrer Auswahl.";
  let machines = [];

  // Logik basierend auf Mitarbeiterzahl & Features
  if (ans.mitarbeiter === 'small') {
    category = "Compact Office";
    reason = "Ideal für kleine Teams und Meetingräume ohne Festwasserbedarf.";
    machines = [
       { name: "L'OR Promesso", tag: "Design Highlight", url: "https://www.jacobs-professional.de/produkte/kaffeemaschinen/liquid-roast-maschinen/lor-promesso/", icon: "💎" },
       { name: "Jura WE8", tag: "Klassiker", url: "https://www.jacobs-professional.de/produkte/kaffeemaschinen/kaffeevollautomaten/jura-we8/", icon: "☕" }
    ];
  } else if (ans.mitarbeiter === 'medium') {
    category = "Business Performance";
    reason = "Perfekte Balance aus Qualität und Kapazität für Büros.";
    machines = [
      { name: "WMF 1100 S", tag: "Vollautomat", url: "https://www.jacobs-professional.de/produkte/kaffeemaschinen/kaffeevollautomaten/wmf-1100s/", icon: "⚙️" },
      { name: "Cafitesse Excellence Compact", tag: "Liquid Roast", url: "https://www.jacobs-professional.de/produkte/kaffeemaschinen/liquid-roast-maschinen/cafitesse-excellence-compact-touch/", icon: "🚀" }
    ];
  } else {
    // Large or XL
    if (ans.features && ans.features.includes('speed')) {
        category = "High Speed & Kantine";
        reason = "Maximale Geschwindigkeit (Liquid Roast) für Stoßzeiten.";
        machines = [
          { name: "Cafitesse Quantum 300", tag: "Speed-Master", url: "https://www.jacobs-professional.de/produkte/kaffeemaschinen/easy-coffee-maschinen/cafitesse-quantum-300/", icon: "⚡" },
          { name: "Cafitesse Excellence Touch", tag: "Touch-Display", url: "https://www.jacobs-professional.de/produkte/kaffeemaschinen/liquid-roast-maschinen/cafitess-excellence-touch/", icon: "🖥️" }
        ];
    } else {
        category = "Premium Barista";
        reason = "Höchste Kaffeequalität mit frischen Bohnen und Milch.";
        machines = [
          { name: "Schaerer Coffee Soul", tag: "Barista Style", url: "https://www.jacobs-professional.de/produkte/kaffeemaschinen/kaffeevollautomaten/schaerer-coffee-soul/", icon: "🎨" },
          { name: "Franke A800", tag: "High-End", url: "https://www.jacobs-professional.de/produkte/kaffeemaschinen/kaffeevollautomaten/franke-a800/", icon: "🦾" }
        ];
    }
  }

  // Add-On Logic
  if(ans.features && ans.features.includes('payment')){
    reason += " Geeignet für Bezahlsysteme.";
  }
  if(ans.features && ans.features.includes('nachhaltig')){
    reason += " Wir empfehlen dazu unsere Bio & Fairtrade Bohnen.";
  }

  return { category, reason, machines };
}

function renderResults() {
  const res = getRecommendation();
  
  let html = `
    <div class="center">
      <div style="font-size:40px; margin-bottom:10px">🎉</div>
      <h2>Ihr perfektes Match: <span style="color:var(--jde-gold)">${res.category}</span></h2>
      <p style="max-width:600px; margin:0 auto 30px;">${res.reason}</p>
    </div>

    <div class="grid cols-2" style="margin-bottom:40px;">
  `;

  res.machines.forEach(m => {
    html += `
      <a href="${m.url}" target="_blank" class="machine-card">
        <div class="machine-header">${m.icon}</div>
        <div class="machine-body">
          <span class="machine-tag">${m.tag}</span>
          <span class="machine-name">${m.name}</span>
          <div style="font-size:0.9rem; color:var(--text-muted)">Klicken für Details</div>
        </div>
        <div class="machine-link">Jetzt ansehen ↗</div>
      </a>
    `;
  });

  html += `
    </div>
    
    <div style="background:var(--jde-cream); padding:24px; border-radius:16px; margin-top:32px;">
      <h3 style="margin-top:0; text-align:center; color:var(--jde-brown)">Interessiert?</h3>
      <p class="center" style="margin-bottom:20px; color:var(--jde-brown)">Fordern Sie ein unverbindliches Angebot an.</p>
      
      <div class="input-group">
        <label>Ihre E-Mail Adresse</label>
        <input type="email" placeholder="name@firma.de" id="finalEmail">
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="alert('Vielen Dank! Ein JDE Berater meldet sich in Kürze.')">Angebot anfordern</button>
      <div class="center" style="margin-top:16px">
        <button class="btn btn-ghost" onclick="location.reload()">Neu starten</button>
      </div>
    </div>
  `;

  app.innerHTML = html;
}

// Init
render();

</script>
</body>
</html>
