<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="A tiny, fast example site" />
  <title>My Fast Site</title>

  <!-- Critical CSS inline for fastest paint (small styles only) -->
  <style>
    /* small critical CSS */
    :root{--bg:#fff;--fg:#111;--accent:#0b6;}
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;}
    body{display:grid;place-items:center;background:var(--bg);color:var(--fg);padding:24px}
    .card{max-width:800px;width:100%;border-radius:12px;padding:28px;box-shadow:0 6px 30px rgba(0,0,0,.08)}
    h1{margin:0 0 8px;font-size:clamp(1.6rem,3vw,2.4rem)}
    p{margin:0 0 16px;line-height:1.5}
    a.button{display:inline-block;padding:10px 16px;border-radius:8px;background:var(--accent);color:white;text-decoration:none}
    img{max-width:100%;height:auto;display:block}
  </style>

  <!-- Load the rest of CSS file (non-blocking) -->
  <link rel="preload" href="styles.css" as="style" onload="this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="styles.css"></noscript>
</head>
<body>
  <main class="card" role="main">
    <h1>Welcome — My Fast Site</h1>
    <p>This is a small, optimized HTML site. Edit <code>index.html</code> and <code>styles.css</code> to customize.</p>
    <a class="button" href="#contact">Contact</a>
  </main>

  <!-- lightweight script at end of body; defer if external -->
  <script>
    // small interactive enhancement (non-blocking)
    document.addEventListener('click', e => {
      if (e.target.matches('.button')) {
        e.target.textContent = 'Thanks!';
      }
    });
  </script>
