<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BOIT Support Bot</title>

  <style>
    body {
      font-family: Arial, sans-serif;
    }

    #chat-toggle {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #007bff;
      color: white;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      font-size: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      z-index: 999;
    }

    #chat-window {
      position: fixed;
      bottom: 100px;
      right: 20px;
      width: 350px;
      height: 450px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
      display: none;
      flex-direction: column;
      z-index: 1000;
    }

    #chat-header {
      background: #007bff;
      color: white;
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-radius: 10px 10px 0 0;
    }

    #chat-messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      font-size: 14px;
    }

    .bot-message {
      background: #e7f1ff;
      padding: 8px;
      border-radius: 5px;
      margin-bottom: 8px;
    }

    .user-message {
      background: #d1ffd1;
      padding: 8px;
      border-radius: 5px;
      margin-bottom: 8px;
      text-align: right;
    }

    #chat-input-area {
      padding: 10px;
      display: flex;
      gap: 5px;
    }

    #chat-input {
      flex: 1;
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    #chat-send {
      padding: 8px 12px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #chat-error {
      color: red;
      font-size: 12px;
      padding: 0 10px 10px;
      display: none;
    }
  </style>
</head>

<body>

  <div id="chat-toggle">💬</div>

  <div id="chat-window">
    <div id="chat-header">
      <span>BOIT Support Bot</span>
      <span id="chat-close" style="cursor:pointer;">✖</span>
    </div>

    <div id="chat-messages"></div>

    <div id="chat-error"></div>

    <div id="chat-input-area">
      <input type="text" id="chat-input" placeholder="Nachricht eingeben..." />
      <button id="chat-send">➤</button>
    </div>
  </div>

  <script>
    // *** WICHTIG: DEINE KORREKTE TUNNEL-URL ***
    const BACKEND_URL = "https://bot.boit.website/chat";

    const chatToggle = document.getElementById('chat-toggle');
    const chatWindow = document.getElementById('chat-window');
    const chatClose = document.getElementById('chat-close');
    const chatMessages = document.getElementById('chat-messages');
    const chatInput = document.getElementById('chat-input');
    const chatSend = document.getElementById('chat-send');
    const chatError = document.getElementById('chat-error');

    let chatState = {};
    let isSending = false;

    chatToggle.onclick = () => {
      chatWindow.style.display = 'flex';
    };

    chatClose.onclick = () => {
      chatWindow.style.display = 'none';
    };

    function addMessage(text, sender = 'bot') {
      const messageDiv = document.createElement('div');
      messageDiv.className = sender === 'user' ? 'user-message' : 'bot-message';
      messageDiv.innerHTML = text;
      chatMessages.appendChild(messageDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function sendMessage() {
      if (isSending) return;

      const text = chatInput.value.trim();
      if (!text) return;

      addMessage(text, 'user');
      chatInput.value = '';
      isSending = true;
      chatError.style.display = 'none';

      try {
        const response = await fetch(BACKEND_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            prompt: text,
            state: chatState
          }),
        });

        if (!response.ok) {
          throw new Error("HTTP-Fehler: " + response.status);
        }

        const data = await response.json();

        chatState = data.state || {};
        addMessage(data.reply || "Keine Antwort erhalten.");

      } catch (error) {
        chatError.innerText = "Serverfehler: Verbindung fehlgeschlagen.";
        chatError.style.display = 'block';
        console.error(error);
      }

      isSending = false;
    }

    chatSend.onclick = sendMessage;
    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });
  </script>

</body>
</html>
